name: Lockfile sync

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - bun.lock
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - bun.lock

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm 10
        run: corepack prepare pnpm@10 --activate
      - name: Check pnpm lockfile
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
